<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(23, 32, 51, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="flex flex-col h-screen justify-between p-4">

    <!-- Top Header -->
    <div class="flex justify-between items-center glass p-3 rounded-2xl">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-xl text-white">
                <i class="fas fa-clapperboard text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-base text-white">AI Video Studio</h1>
                <p class="text-xs text-blue-400 font-semibold tracking-wider">ULTIMATE CINEMA SUITE</p>
            </div>
        </div>
        <button onclick="toggleApiModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1 border border-gray-700">
            <i class="fas fa-cog"></i>
            <span>API Config</span>
        </button>
    </div>

    <!-- Output Area -->
    <div class="glass p-4 rounded-2xl my-4 flex-1 overflow-y-auto" id="outputBox">
        <div class="flex justify-between items-center mb-3 text-xs">
            <span class="bg-blue-950 text-blue-400 border border-blue-800 px-2.5 py-1 rounded-lg font-bold">FORMAT: SHORT</span>
            <span id="statusBadge" class="text-emerald-400 font-medium">● Səhnə Kadrajı Hazırdır</span>
        </div>
        <div id="resultContent" class="bg-gray-900/60 p-4 rounded-xl text-sm leading-relaxed border border-gray-800/80 whitespace-pre-wrap">
Səhnə generasiya olunacaq sahə buradır. Aşağıya ideyanızı yazın və göndərin.
        </div>
    </div>

    <!-- Format Chooser -->
    <div class="glass p-3 rounded-2xl mb-4">
        <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-xs font-bold text-gray-400 tracking-wider">LAYİHƏ FORMATI</span>
            <span class="text-xs text-blue-400 bg-blue-950/60 px-2 py-0.5 rounded-md border border-blue-900">9:16 Vertical</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <button class="bg-blue-600 text-white py-2 px-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 shadow-lg shadow-blue-900/30">
                <span>⚡ Shorts / TikTok</span>
            </button>
            <button class="bg-gray-800/80 text-gray-300 py-2 px-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 border border-gray-700">
                <span>🎬 Bütöv Film</span>
            </button>
            <button class="bg-gray-800/80 text-gray-300 py-2 px-1 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 border border-gray-700">
                <span>📺 Serial Seriyası</span>
            </button>
        </div>
    </div>

    <!-- Bottom Input Bar -->
    <div class="flex items-center gap-2 mb-2">
        <button class="bg-gray-800/90 hover:bg-gray-700 text-gray-300 p-3.5 rounded-2xl border border-gray-700">
            <i class="fas fa-plus"></i>
        </button>
        <div class="flex-1 relative">
            <input type="text" id="userInput" placeholder="Ssenari daxil edin..." class="w-full bg-gray-900/90 border border-gray-700/80 text-white text-sm rounded-2xl py-3.5 px-4 focus:outline-none focus:border-blue-500">
        </div>
        <button onclick="generateScript()" class="bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-2xl shadow-lg shadow-blue-600/30">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <!-- API Key Modal -->
    <div id="apiModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass p-6 rounded-2xl max-w-sm w-full space-y-4">
            <h2 class="text-base font-bold text-white">Google Gemini API Açar</h2>
            <p class="text-xs text-gray-400">Pulsuz API açarınızı daxil edin.</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-xl p-3 focus:outline-none focus:border-blue-500">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleApiModal()" class="px-4 py-2 bg-gray-800 text-gray-300 text-xs rounded-xl">Bağla</button>
                <button onclick="saveApiKey()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Yadda Saxla</button>
            </div>
        </div>
    </div>

    <script>
        function toggleApiModal() {
            const modal = document.getElementById('apiModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Açar yadda saxlanıldı!');
                toggleApiModal();
            } else {
                alert('Zəhmət olmasa etibarlı açar daxil edin!');
            }
        }

        async function generateScript() {
            const prompt = document.getElementById('userInput').value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            const resultContent = document.getElementById('resultContent');
            const statusBadge = document.getElementById('statusBadge');

            if (!apiKey) {
                alert('Xahiş edirik ilk növbədə API Config bölməsindən Gemini API açarınızı daxil edin!');
                toggleApiModal();
                return;
            }

            if (!prompt) {
                alert('Zəhmət olmasa bir ideya və ya ssenari yazın!');
                return;
            }

            resultContent.innerText = "⏳ AI ssenarini hazırlayır, zəhmət olmasa gözləyin...";
            statusBadge.innerText = "● Generasiya olunur...";
            statusBadge.className = "text-yellow-400 font-medium";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Sən peşəkar film rejissorusan. Aşağıdakı ideya üçün kadr-kadr video ssenarisi və vizual promptlar hazırla:\n\nİdeya: ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultContent.innerText = data.candidates[0].content.parts[0].text;
                    statusBadge.innerText = "● Səhnə Kadrajı Hazırdır";
                    statusBadge.className = "text-emerald-400 font-medium";
                } else if (data.error) {
                    resultContent.innerText = "❌ API Xətası: " + data.error.message;
                    statusBadge.innerText = "● Xəta baş verdi";
                    statusBadge.className = "text-red-400 font-medium";
                } else {
                    resultContent.innerText = "❌ Naməlum xəta baş verdi. Zəhmət olmasa API açarınızı yoxlayın.";
                    statusBadge.innerText = "● Xəta baş verdi";
                    statusBadge.className = "text-red-400 font-medium";
                }
            } catch (err) {
                resultContent.innerText = "❌ Qoşulma xətası: " + err.message;
                statusBadge.innerText = "● Qoşulma xətası";
                statusBadge.className = "text-red-400 font-medium";
            }
        }
    </script>
</body>
</html>
