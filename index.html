      <!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(23, 32, 51, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="flex flex-col h-screen justify-between p-4">

    <!-- Top Header -->
    <div class="flex justify-between items-center glass p-3 rounded-2xl">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-2.5 rounded-xl text-white shadow-lg">
                <i class="fas fa-video text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white">AI Video Studio Pro</h1>
                <p class="text-[10px] text-blue-400 font-semibold tracking-wider">MÜSTƏQİL İDARƏETMƏ</p>
            </div>
        </div>
    </div>

    <!-- API Key Input Section -->
    <div class="glass p-3 rounded-2xl my-2 flex items-center space-x-2">
        <i class="fas fa-key text-blue-400 text-xs"></i>
        <input type="password" id="directApiKey" placeholder="Gemini API açarını bura yapışdır..." class="w-full bg-gray-900 border border-gray-700 text-white text-xs rounded-xl p-2 focus:outline-none focus:border-blue-500">
    </div>

    <!-- Main Workspace -->
    <div class="glass p-4 rounded-2xl my-2 flex-1 overflow-y-auto flex flex-col space-y-3" id="outputBox">
        <div class="flex justify-between items-center text-xs">
            <span class="bg-indigo-950 text-indigo-400 border border-indigo-800 px-2.5 py-1 rounded-lg font-bold">HAZIRDIR</span>
            <span id="statusBadge" class="text-emerald-400 font-medium">● Bağlantı gözlənilir</span>
        </div>

        <!-- Image Preview Area -->
        <div id="imagePreviewContainer" class="hidden relative w-full h-32 bg-gray-900 rounded-xl overflow-hidden border border-gray-700 flex items-center justify-center">
            <img id="uploadedImage" class="h-full object-contain" alt="Yüklənən şəkil">
            <button onclick="removeImage()" class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="resultContent" class="bg-gray-900/80 p-3.5 rounded-xl text-xs leading-relaxed border border-gray-800/80 whitespace-pre-wrap flex-1">
API açarını yuxarıdakı xanaya daxil et, şəkil yüklə və ya istədiyini yazub göndər!
        </div>
    </div>

    <!-- Input & Controls Bar -->
    <div class="flex flex-col gap-2 mb-1">
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

        <div class="flex items-center gap-2">
            <button onclick="document.getElementById('imageInput').click()" class="bg-gray-800 hover:bg-gray-700 text-blue-400 p-3.5 rounded-2xl border border-gray-700 shadow" title="Şəkil yüklə">
                <i class="fas fa-image text-base"></i>
            </button>
            <div class="flex-1 relative">
                <input type="text" id="userInput" placeholder="Məs: Mahnı oxuyan uşaq..." class="w-full bg-gray-900/90 border border-gray-700 text-white text-xs rounded-2xl py-3.5 px-4 focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="sendToGemini()" class="bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-2xl shadow-lg shadow-blue-600/30">
                <i class="fas fa-paper-plane text-base"></i>
            </button>
        </div>
    </div>

    <script>
        let currentBase64Image = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    document.getElementById('uploadedImage').src = currentBase64Image;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentBase64Image = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        async function sendToGemini() {
            const apiKey = document.getElementById('directApiKey').value.trim();
            const prompt = document.getElementById('userInput').value.trim();
            const resultContent = document.getElementById('resultContent');
            const statusBadge = document.getElementById('statusBadge');

            if (!apiKey) {
                alert('Zəhmət olmasa yuxarıdakı xanaya API açarını daxil et!');
                return;
            }

            if (!prompt && !currentBase64Image) {
                alert('Mətn və ya şəkil daxil etməlisən!');
                return;
            }

            resultContent.innerText = "⏳ Sorğu göndərilir...";
            statusBadge.innerText = "● İcra olunur...";
            statusBadge.className = "text-yellow-400 font-medium";

            try {
                let parts = [];
                if (prompt) {
                    parts.push({ text: prompt });
                } else {
                    parts.push({ text: "Bu şəkli analiz et və video üçün təsvir yaz." });
                }

                if (currentBase64Image) {
                    const base64Data = currentBase64Image.split(',')[1];
                    const mimeType = currentBase64Image.split(';')[0].split(':')[1];
                    parts.push({
                        inline_data: { mime_type: mimeType, data: base64Data }
                    });
                }

                // Dəstəklənən ən stabil model ilə sorğu
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gem-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultContent.innerText = data.candidates[0].content.parts[0].text;
                    statusBadge.innerText = "● Hazırdır";
                    statusBadge.className = "text-emerald-400 font-medium";
                } else if (data.error) {
                    resultContent.innerText = "❌ Xəta: " + data.error.message;
                    statusBadge.innerText = "● Xəta";
                    statusBadge.className = "text-red-400 font-medium";
                } else {
                    resultContent.innerText = "❌ Naməlum cavab alındı.";
                    statusBadge.innerText = "● Xəta";
                    statusBadge.className = "text-red-400 font-medium";
                }
            } catch (err) {
                resultContent.innerText = "❌ Bağlantı xətası: " + err.message;
                statusBadge.innerText = "● Xəta";
                statusBadge.className = "text-red-400 font-medium";
            }
        }
    </script>
</body>
</html>
