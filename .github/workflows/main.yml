name: AI Video Studio Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  run-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları götür
        uses: actions/checkout@v3

      - name: Python mühitini qur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Əsas Python skriptini işə sal
        run: python main.py
